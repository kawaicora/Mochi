name: Release Build (v142)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    # =========================
    # 1. Checkout
    # =========================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # =========================
    # 2. Install VS2019 v142 + ATL
    # =========================
    - name: Install MSVC v142 + ATL
      run: |
        choco install visualstudio2019buildtools --yes --no-progress --package-parameters "
          --add Microsoft.VisualStudio.Workload.VCTools ^
          --add Microsoft.VisualStudio.Component.VC.ATLMFC ^
          --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
          --add Microsoft.VisualStudio.Component.Windows10SDK.19041 ^
          --includeRecommended ^
          --includeOptional ^
          --quiet --norestart
        "

    # =========================
    # 3. Setup MSVC environment (v142)
    # =========================
    - name: Setup MSVC v142 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    # =========================
    # 4. Build solution
    # =========================
    - name: Build Release x86
      shell: pwsh
      run: |
        msbuild Mochi.sln `
          /m `
          /p:Configuration=Release `
          /p:Platform=x86

    # =========================
    # 5. Create GitHub Release
    # =========================
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          **/Release/*.dll
          **/Release/*.pdb