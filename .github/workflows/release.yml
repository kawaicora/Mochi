name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install VC tools (ATL included)
        shell: pwsh
        run: |
          choco install visualstudio2022-workload-vctools --yes

      - name: Build
        shell: pwsh
        run: |
          msbuild Mochi.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/Release/*.dll
            **/Release/*.pdb