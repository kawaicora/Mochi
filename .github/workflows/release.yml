name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 拉代码 + 子模块
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 安装 ATL（关键修复）
      - name: Install ATL (VC ATLMFC)
        shell: pwsh
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"

          if (!(Test-Path $vsPath)) {
            throw "Visual Studio not found at $vsPath"
          }

          Write-Host "Using VS: $vsPath"

          & "$vsPath\Common7\IDE\vs_installer.exe" modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --norestart

      # 3. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4. Build
      - name: Build (Release x86)
        shell: pwsh
        run: |
          msbuild Mochi.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x86

      # 5. Release upload
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/Release/*.dll
            **/Release/*.pdb