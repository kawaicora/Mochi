name: Build Mochi

on:
  push:
    branches:
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Release]
        platform: [x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: |
          msbuild Mochi.sln ^
            /m ^
            /p:Configuration=${{ matrix.config }} ^
            /p:Platform=${{ matrix.platform }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-${{ matrix.config }}-${{ matrix.platform }}
          path: |
            **/Release/*.dll
            **/Release/*.pdb